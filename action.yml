name: pinakas
description: Keep the Kanban board in sync with pull requests and enforce the human + agent workflow.
author: Marco Mornati
branding:
  icon: columns
  color: blue

inputs:
  command:
    description: "sync-pr (move cards and record timing), check-ci (required workflow check) or report (story metrics in the job summary)."
    required: true
  args:
    description: "Extra arguments for report, such as \"--since 30d\" or \"--all --measured\"."
    required: false
    default: ""
  token:
    description: >-
      Token that can read and write the GitHub Project and the issues: a classic
      PAT with the "project" and "repo" scopes, or a GitHub App token.
      GITHUB_TOKEN cannot read projects owned by a user.
    required: true
  version:
    description: "pinakas version to install. Defaults to the ref this action is used at (e.g. v0.3.0)."
    required: false
    default: ""
  working-directory:
    description: "Directory holding .pinakas.yml (or below it)."
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: "1.27.x"
        cache: false

    - name: Install pinakas
      shell: bash
      env:
        VERSION: ${{ inputs.version || github.action_ref || 'latest' }}
      run: go install "github.com/mmornati/pinakas/cmd/pinakas@${VERSION}"

    - name: Run pinakas
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        COMMAND: ${{ inputs.command }}
        ARGS: ${{ inputs.args }}
      run: |
        pinakas="$(go env GOPATH)/bin/pinakas"
        case "$COMMAND" in
          sync-pr|check-ci) "$pinakas" "$COMMAND" ;;
          report)
            read -r -a extra <<< "$ARGS"
            "$pinakas" report --format markdown "${extra[@]}" | tee -a "$GITHUB_STEP_SUMMARY" ;;
          *) echo "::error::command must be sync-pr, check-ci or report, got '$COMMAND'"; exit 1 ;;
        esac
