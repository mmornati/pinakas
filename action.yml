name: pinakas
description: Keep the Kanban board in sync with pull requests and enforce the human + agent workflow.
author: Marco Mornati
branding:
  icon: columns
  color: blue

inputs:
  command:
    description: "sync-pr (move cards and record timing) or check-ci (required workflow check)."
    required: true
  token:
    description: >-
      Token that can read and write the GitHub Project and the issues: a classic
      PAT with the "project" and "repo" scopes, or a GitHub App token.
      GITHUB_TOKEN cannot read projects owned by a user.
    required: true
  version:
    description: "pinakas version to install. Defaults to the ref this action is used at (e.g. v0.2.0)."
    required: false
    default: ""
  working-directory:
    description: "Directory holding .pinakas.yml (or below it)."
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: "1.27.x"
        cache: false

    - name: Install pinakas
      shell: bash
      env:
        VERSION: ${{ inputs.version || github.action_ref || 'latest' }}
      run: go install "github.com/mmornati/pinakas/cmd/pinakas@${VERSION}"

    - name: Run pinakas
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        COMMAND: ${{ inputs.command }}
      run: |
        case "$COMMAND" in
          sync-pr|check-ci) ;;
          *) echo "::error::command must be sync-pr or check-ci, got '$COMMAND'"; exit 1 ;;
        esac
        "$(go env GOPATH)/bin/pinakas" "$COMMAND"
