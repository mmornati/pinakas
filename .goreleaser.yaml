# Release pinakas binaries when a v* tag is pushed (see .github/workflows/release.yml).
version: 2

project_name: pinakas

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: pinakas
    main: ./cmd/pinakas
    binary: pinakas
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mmornati/pinakas/internal/cli.Version={{ .Version }}

archives:
  - id: pinakas
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: mmornati
    name: pinakas
  # Keep notes written by hand on the release page.
  mode: keep-existing
